<!DOCTYPE html>
<html lang="ru"><head><meta charset="utf-8"><base href="../"><title>char prep</title>
<style>html,body{margin:0;background:#20242a;color:#9fb;font:12px/1.5 monospace}
#log{padding:8px;white-space:pre-wrap}canvas{display:block}</style>
<script type="importmap">
{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.168.0/build/three.module.js",
"three/addons/":"https://cdn.jsdelivr.net/npm/three@0.168.0/examples/jsm/"}}
</script></head><body>
<div id="log">жду…</div><canvas id="c"></canvas>
<script type="module">
/* Подготовка персонажа к автоматической оснастке на Mixamo.

   Mixamo ломается не на «плохой модели», а на мусоре рядом с ней:
   в экспорте из Blender обычно уезжает вся сцена — пол, куб, камера,
   лампа, — и риггер честно пытается оснастить пол. Плюс ему нужна
   поза буквой Т: руки в стороны, врозь, на одной высоте.

   Что делает страница:
     — выбрасывает всё, кроме перечисленных мешей персонажа;
     — разводит руки в стороны, вращая каждую вокруг её плеча;
     — ставит на ноль по земле, центрует, приводит к нужному росту;
     — сливает всё в один меш с группами по материалам (Mixamo
       спокойнее к одному мешу, чем к шестнадцати);
     — переименовывает меши и материалы латиницей: кириллица в obj
       и mtl — лишний повод для чужого импортёра споткнуться;
     — кладёт .obj и .mtl обратно на сервер (нужен tools/serve.py).

   Открывать С ТОГО ЖЕ ПОРТА, что и serve.py, иначе PUT не пройдёт.

   Параметры:
     ?url=       исходник (.fbx или .glb)
     ?keep=      меши персонажа через запятую; пусто — берём все
     ?drop=      что выбросить (если keep не задан)
     ?arms=      два меша-руки: развести в стороны
     ?body=      меш-туловище: от него считается плечо
     ?height=    итоговый рост в единицах (по умолчанию 170)
     ?out=       куда положить, без расширения
*/
import * as THREE from 'three';
import { FBXLoader } from 'three/addons/loaders/FBXLoader.js';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import { GLTFExporter } from 'three/addons/exporters/GLTFExporter.js';
import { mergeGeometries, mergeVertices } from 'three/addons/utils/BufferGeometryUtils.js';

const q = new URLSearchParams(location.search);
const URL_ = q.get('url') || '_kopatuch.fbx';
const KEEP = (q.get('keep') || '').split(',').map((s) => s.trim()).filter(Boolean);
const DROP = (q.get('drop') || '').split(',').map((s) => s.trim()).filter(Boolean);
const ARMS = (q.get('arms') || '').split(',').map((s) => s.trim()).filter(Boolean);
const BODY = q.get('body') || '';
const HEIGHT = +(q.get('height') || 170);
const OUT = q.get('out') || 'tools/out/character';

const log = (t) => { document.getElementById('log').textContent += '\n' + t; };

/* Кириллица в именах — частая причина, по которой чужой импортёр
   спотыкается на .obj/.mtl. Переводим в латиницу один раз. */
const RU = { а:'a',б:'b',в:'v',г:'g',д:'d',е:'e',ё:'e',ж:'zh',з:'z',и:'i',й:'y',
  к:'k',л:'l',м:'m',н:'n',о:'o',п:'p',р:'r',с:'s',т:'t',у:'u',ф:'f',х:'h',
  ц:'c',ч:'ch',ш:'sh',щ:'sch',ъ:'',ы:'y',ь:'',э:'e',ю:'yu',я:'ya' };
function ascii(s, fallback) {
  const out = s.toLowerCase().replace(/[Ѐ-ӿ]/g, (c) => RU[c] ?? '');
  const clean = out.replace(/[^a-z0-9_]+/g, '_').replace(/^_+|_+$/g, '');
  return clean || fallback;
}

function load(url) {
  return /\.fbx(\?|$)/i.test(url)
    ? new FBXLoader().loadAsync(url)
    : new GLTFLoader().loadAsync(url).then((g) => g.scene);
}

/** Крайние точки меша по удалённости от точки: ближняя и дальняя. */
function ends(geo, from) {
  const p = geo.getAttribute('position');
  let near = null, far = null, dn = Infinity, df = -Infinity;
  const v = new THREE.Vector3();
  for (let i = 0; i < p.count; i++) {
    v.fromBufferAttribute(p, i);
    const d = v.distanceToSquared(from);
    if (d < dn) { dn = d; near = v.clone(); }
    if (d > df) { df = d; far = v.clone(); }
  }
  return { near, far };
}

load(URL_).then((root) => {
  root.updateWorldMatrix(true, true);

  // 1. отобрать меши персонажа, запечь в вершины их мировые матрицы.
  //    Меш бывает многоматериальным — у кепки, например, отдельно тулья
  //    и отдельно лента, — и тогда он режется на куски по группам:
  //    взять у такого только первый материал значит перекрасить пол-шляпы.
  const parts = [];
  const tidy = (g) => {
    for (const a of Object.keys(g.attributes)) {
      if (!['position', 'normal', 'uv'].includes(a)) g.deleteAttribute(a);
    }
    if (!g.getAttribute('normal')) g.computeVertexNormals();
    if (!g.getAttribute('uv')) {
      g.setAttribute('uv', new THREE.BufferAttribute(
        new Float32Array(g.getAttribute('position').count * 2), 2));
    }
    return g;
  };
  const slice = (g, start, count) => {
    const flat = g.index ? g.toNonIndexed() : g;
    const out = new THREE.BufferGeometry();
    for (const nm of ['position', 'normal', 'uv']) {
      const a = flat.getAttribute(nm);
      if (!a) continue;
      out.setAttribute(nm, new THREE.BufferAttribute(
        a.array.slice(start * a.itemSize, (start + count) * a.itemSize), a.itemSize));
    }
    return out;
  };
  root.traverse((o) => {
    if (!o.isMesh) return;
    if (KEEP.length ? !KEEP.includes(o.name) : DROP.includes(o.name)) return;
    const g = o.geometry.clone();
    g.applyMatrix4(o.matrixWorld);
    const ms = Array.isArray(o.material) ? o.material : [o.material];
    if (ms.length > 1 && g.groups && g.groups.length > 1) {
      g.groups.forEach((gr, i) => {
        const piece = tidy(slice(g, gr.start, gr.count));
        parts.push({ name: o.name + '_' + (i + 1), geo: piece, mat: ms[gr.materialIndex] || ms[0], of: o.name });
      });
      log('меш ' + o.name + ': ' + g.groups.length + ' материала, режу на куски');
    } else {
      parts.push({ name: o.name, geo: tidy(g), mat: ms[0], of: o.name });
    }
  });
  log('взято мешей: ' + parts.length + ' — ' + parts.map((p) => p.name).join(', '));
  if (!parts.length) { log('ОШИБКА: ни один меш не подошёл'); return; }

  // 2. центр туловища — от него считаем, где у руки плечо
  const bodyPart = parts.find((p) => p.name === BODY) || parts[0];
  bodyPart.geo.computeBoundingBox();
  const bodyC = bodyPart.geo.boundingBox.getCenter(new THREE.Vector3());
  const bodyR = bodyPart.geo.boundingBox.getSize(new THREE.Vector3()).x * 0.5;

  // 3. поза буквой Т: каждую руку поворачиваем вокруг её плеча так,
  //    чтобы она смотрела строго вбок, и сажаем плечи симметрично
  if (ARMS.length === 2) {
    const side = [];
    for (const nm of ARMS) {
      const p = parts.find((x) => x.name === nm);
      if (!p) { log('руки «' + nm + '» нет — пропускаю'); continue; }
      p.geo.computeBoundingBox();
      const c = p.geo.boundingBox.getCenter(new THREE.Vector3());
      side.push({ p, sign: Math.sign(c.x - bodyC.x) || 1 });
    }
    // если обе руки оказались с одной стороны, разводим принудительно
    if (side.length === 2 && side[0].sign === side[1].sign) side[1].sign = -side[0].sign;
    const shoulderY = bodyC.y + bodyR * 0.12;
    for (const { p, sign } of side) {
      const e = ends(p.geo, bodyC);
      const axis = e.far.clone().sub(e.near).normalize();
      const target = new THREE.Vector3(sign, 0, 0);
      const rot = new THREE.Quaternion().setFromUnitVectors(axis, target);
      const pivot = e.near.clone();
      p.geo.translate(-pivot.x, -pivot.y, -pivot.z);
      p.geo.applyQuaternion(rot);
      // плечо — чуть внутри туловища, чтобы рука не отрывалась
      p.geo.translate(bodyC.x + sign * bodyR * 0.74, shoulderY, bodyC.z);
      p.geo.computeBoundingBox();
      log('рука ' + p.name + ' → ' + (sign > 0 ? 'вправо' : 'влево') +
          ', длина ' + e.far.distanceTo(e.near).toFixed(0));
    }
  }

  // 4. один меш с группами по материалам: Mixamo спокойнее к одному
  const byMat = new Map();
  for (const p of parts) {
    const key = p.mat ? p.mat.uuid : 'нет';
    if (!byMat.has(key)) byMat.set(key, { mat: p.mat, geos: [] });
    byMat.get(key).geos.push(p.geo);
  }
  const order = [...byMat.values()];
  const mats = [], geos = [];
  order.forEach((grp, i) => {
    const g = grp.geos.length > 1 ? mergeGeometries(grp.geos.map((x) => x.index ? x.toNonIndexed() : x), false)
                                  : (grp.geos[0].index ? grp.geos[0].toNonIndexed() : grp.geos[0]);
    geos.push(g);
    const src = grp.mat || new THREE.MeshStandardMaterial();
    const m = new THREE.MeshStandardMaterial({ color: src.color ? src.color.clone() : new THREE.Color(0xcccccc) });
    m.name = ascii(src.name || '', 'mat') + '_' + (i + 1);
    mats.push(m);
  });
  const merged = mergeGeometries(geos, true);
  if (!merged) { log('ОШИБКА: не удалось слить куски'); return; }

  // 5. на землю, по центру, в нужный рост
  merged.computeBoundingBox();
  let b = merged.boundingBox;
  const size = b.getSize(new THREE.Vector3());
  const k = HEIGHT / size.y;
  merged.translate(-(b.min.x + b.max.x) / 2, -b.min.y, -(b.min.z + b.max.z) / 2);
  merged.scale(k, k, k);
  merged.computeBoundingBox();
  merged.computeVertexNormals();
  b = merged.boundingBox;
  const s2 = b.getSize(new THREE.Vector3());
  log('итог: ' + [s2.x, s2.y, s2.z].map((v) => v.toFixed(1)).join(' x ') +
      ', низ y=' + b.min.y.toFixed(2) + ', треугольников ' +
      (merged.getAttribute('position').count / 3).toFixed(0));

  const mesh = new THREE.Mesh(merged, mats);
  mesh.name = ascii(OUT.split('/').pop(), 'character');

  preview(mesh);
  save(mesh, mats);
  window.__mesh = mesh;
});

function preview(mesh) {
  const W = 860, H = 460;
  const sc = new THREE.Scene();
  sc.background = new THREE.Color(0x20242a);
  sc.add(new THREE.HemisphereLight(0xffffff, 0x445566, 2.2));
  const d = new THREE.DirectionalLight(0xffffff, 1.9); d.position.set(0.6, 1, 0.9); sc.add(d);
  const d2 = new THREE.DirectionalLight(0xffffff, 0.8); d2.position.set(-0.7, 0.3, -0.7); sc.add(d2);
  sc.add(mesh);
  const cv = document.getElementById('c');
  const r = new THREE.WebGLRenderer({ canvas: cv, antialias: true, preserveDrawingBuffer: true });
  r.setPixelRatio(1); r.setSize(W, H); r.setScissorTest(true);
  r.outputColorSpace = THREE.SRGBColorSpace;
  const b = new THREE.Box3().setFromObject(mesh);
  const c = b.getCenter(new THREE.Vector3());
  const R = Math.max(...b.getSize(new THREE.Vector3()).toArray()) * 1.35;
  const cam = new THREE.PerspectiveCamera(32, (W / 3) / H, R / 100, R * 8);
  r.setViewport(0, 0, W, H); r.setScissor(0, 0, W, H); r.setClearColor(0x20242a, 1); r.clear();
  [[0, 0, 1], [1, 0, 0.001], [0.8, 0.45, 0.8]].forEach((v, i) => {
    r.setViewport(i * W / 3, 0, W / 3, H);
    r.setScissor(i * W / 3 + 1, 1, W / 3 - 2, H - 2);
    cam.position.set(c.x + v[0] * R * 2.3, c.y + v[1] * R * 2.3, c.z + v[2] * R * 2.3);
    cam.lookAt(c); cam.updateProjectionMatrix();
    r.render(sc, cam);
  });
  log('вид: спереди (+Z, так Mixamo и ждёт) · сбоку · три четверти');
}

/**
 * Свой экспорт в .obj.
 *
 * OBJExporter из three материалы не пишет вовсе — ни одной строки
 * usemtl, — и модель приезжает к Mixamo сплошь белой. Здесь группы
 * геометрии раскладываются по usemtl, а вершины и нормали сводятся к
 * уникальным: у OBJExporter они дублируются на каждую грань, и текст
 * раздувается в разы.
 */
function toOBJ(mesh, mats, base) {
  const geo = mesh.geometry;
  const pos = geo.getAttribute('position');
  const nor = geo.getAttribute('normal');
  const idx = geo.getIndex();
  const count = idx ? idx.count : pos.count;
  const at = (i) => (idx ? idx.getX(i) : i);

  const vLines = [], nLines = [];
  const vMap = new Map(), nMap = new Map();
  const vOf = new Int32Array(pos.count).fill(-1);
  const nOf = new Int32Array(pos.count).fill(-1);
  const r4 = (x) => (Math.round(x * 1e4) / 1e4).toFixed(4);

  for (let i = 0; i < pos.count; i++) {
    const vk = r4(pos.getX(i)) + ' ' + r4(pos.getY(i)) + ' ' + r4(pos.getZ(i));
    let v = vMap.get(vk);
    if (v === undefined) { vLines.push('v ' + vk); v = vLines.length; vMap.set(vk, v); }
    vOf[i] = v;
    const nk = r4(nor.getX(i)) + ' ' + r4(nor.getY(i)) + ' ' + r4(nor.getZ(i));
    let n = nMap.get(nk);
    if (n === undefined) { nLines.push('vn ' + nk); n = nLines.length; nMap.set(nk, n); }
    nOf[i] = n;
  }

  // группы задают, какой кусок треугольников каким материалом крыть
  let groups = geo.groups && geo.groups.length
    ? geo.groups.slice().sort((a, b) => a.start - b.start)
    : [{ start: 0, count, materialIndex: 0 }];

  const out = ['mtllib ' + base + '.mtl', 'o ' + mesh.name, ...vLines, ...nLines];
  for (const g of groups) {
    const m = mats[g.materialIndex] || mats[0];
    out.push('usemtl ' + (m ? m.name : 'mat_1'));
    const end = Math.min(g.start + g.count, count);
    for (let i = g.start; i + 2 < end + 1 && i + 2 < count; i += 3) {
      const a = at(i), b = at(i + 1), c = at(i + 2);
      out.push('f ' + vOf[a] + '//' + nOf[a] +
               ' ' + vOf[b] + '//' + nOf[b] +
               ' ' + vOf[c] + '//' + nOf[c]);
    }
  }
  return out.join('\n') + '\n';
}

async function save(mesh, mats) {
  const base = OUT.split('/').pop();
  // .obj — текст, и в нём каждая вершина пишется словами. После слияния
  // кусков геометрия разиндексирована: у куба 36 вершин вместо 8.
  // Сшиваем совпадающие и режем точность до четырёх знаков — файл
  // худеет вчетверо, а на модели ростом 170 единиц это доли миллиметра.
  const before = mesh.geometry.getAttribute('position').count;
  const groups = mesh.geometry.groups.map((g) => ({ ...g }));
  const packed = mergeVertices(mesh.geometry, 1e-4);
  packed.groups = groups;
  mesh.geometry = packed;
  log('вершин: ' + before + ' → ' + packed.getAttribute('position').count);

  const obj = toOBJ(mesh, mats, base);
  // OBJExporter ссылается на материалы по имени, но сам .mtl не пишет
  const mtl = mats.map((m) => {
    // .mtl хранит цвет как его видит глаз, а three держит рабочий цвет
    // линейным. Без перевода оранжевая тулья кепки приезжает красной.
    const c = m.color.getRGB({}, THREE.SRGBColorSpace);
    return 'newmtl ' + m.name +
      '\nKd ' + [c.r, c.g, c.b].map((v) => v.toFixed(4)).join(' ') +
      '\nKa 0 0 0\nKs 0.05 0.05 0.05\nNs 12\nd 1\nillum 2\n';
  }).join('\n');
  const withLib = obj;
  for (const [path, text] of [[OUT + '.obj', withLib], [OUT + '.mtl', mtl]]) {
    const res = await fetch('/' + path, { method: 'PUT', body: new Blob([text]) });
    log(path + ': ' + res.status + ' ' + (await res.text()));
  }

  // И тот же персонаж в .glb — Mixamo его не принимает, но игра читает
  // напрямую: пригодится, если оснастку придётся делать не автоматом.
  const glb = await new Promise((ok, no) =>
    new GLTFExporter().parse(mesh, ok, no, { binary: true }));
  const r2 = await fetch('/' + OUT + '.glb', { method: 'PUT', body: new Blob([glb]) });
  log(OUT + '.glb: ' + r2.status + ' ' + (await r2.text()));

  window.__obj = withLib;
  window.__ready = true;
}
</script></body></html>
